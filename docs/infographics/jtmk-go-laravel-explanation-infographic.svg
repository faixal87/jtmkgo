<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">JTMK Go Laravel Explanation Infographic</title>
  <desc id="desc">Simple Malay infographic explaining that JTMK Go is built with Laravel, Blade, Tailwind CSS and MySQL using modular architecture.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fee7"/>
      <stop offset="48%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="matcha" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a3be5f"/>
      <stop offset="100%" stop-color="#d9f99d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#3b244f" flood-opacity="0.14"/>
    </filter>
    <style>
      .title { font: 800 56px 'Century Gothic', 'Inter', Arial, sans-serif; fill: #221b2f; }
      .subtitle { font: 500 24px 'Century Gothic', 'Inter', Arial, sans-serif; fill: #5f556b; }
      .section-title { font: 800 25px 'Century Gothic', 'Inter', Arial, sans-serif; fill: #221b2f; }
      .body { font: 500 20px 'Century Gothic', 'Inter', Arial, sans-serif; fill: #44394f; }
      .small { font: 600 17px 'Century Gothic', 'Inter', Arial, sans-serif; fill: #6b6474; }
      .label { font: 800 18px 'Century Gothic', 'Inter', Arial, sans-serif; fill: #ffffff; letter-spacing: .6px; }
      .pill-text { font: 800 18px 'Century Gothic', 'Inter', Arial, sans-serif; fill: #4c1d95; }
      .card { fill: rgba(255,255,255,.82); stroke: #ded8c8; stroke-width: 2; filter: url(#shadow); }
      .mini { fill: rgba(255,255,255,.92); stroke: #ded8c8; stroke-width: 1.5; }
      .line { stroke: #7c3aed; stroke-width: 5; stroke-linecap: round; opacity: .8; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1400" cy="120" r="180" fill="#f9a8d4" opacity=".16"/>
  <circle cx="180" cy="780" r="240" fill="#bef264" opacity=".19"/>
  <circle cx="1260" cy="810" r="180" fill="#c4b5fd" opacity=".18"/>

  <text x="80" y="90" class="title">JTMK Go! dibangunkan macam mana?</text>
  <text x="82" y="128" class="subtitle">Ringkasnya: bukan hardcode page semata-mata, tetapi sistem Laravel yang berstruktur dan database-driven.</text>

  <rect x="80" y="170" width="560" height="300" rx="26" class="card"/>
  <rect x="110" y="200" width="86" height="38" rx="19" fill="url(#purple)"/>
  <text x="134" y="225" class="label">01</text>
  <text x="220" y="228" class="section-title">Laravel Framework</text>
  <text x="120" y="275" class="body">Laravel susun sistem ikut struktur MVC:</text>
  <text x="140" y="320" class="body">Route - terima URL dan arahkan flow</text>
  <text x="140" y="360" class="body">Controller - proses request pengguna</text>
  <text x="140" y="400" class="body">Model/Eloquent - berhubung dengan database</text>
  <text x="140" y="440" class="body">Blade - paparkan interface kepada pengguna</text>

  <rect x="690" y="170" width="390" height="300" rx="26" class="card"/>
  <rect x="720" y="200" width="86" height="38" rx="19" fill="url(#matcha)"/>
  <text x="744" y="225" class="label">02</text>
  <text x="830" y="228" class="section-title">Blade UI</text>
  <text x="730" y="275" class="body">Blade ialah HTML yang</text>
  <text x="730" y="310" class="body">boleh baca data Laravel.</text>
  <text x="730" y="365" class="small">Contoh:</text>
  <rect x="730" y="388" width="300" height="48" rx="12" fill="#f1eaff" stroke="#c4b5fd"/>
  <text x="750" y="420" class="pill-text">{{ user.name }}</text>

  <rect x="1130" y="170" width="390" height="300" rx="26" class="card"/>
  <rect x="1160" y="200" width="86" height="38" rx="19" fill="#2563eb"/>
  <text x="1184" y="225" class="label">03</text>
  <text x="1270" y="228" class="section-title">MySQL Database</text>
  <text x="1170" y="275" class="body">Data tidak ditanam dalam</text>
  <text x="1170" y="310" class="body">page. Ia disimpan dalam</text>
  <text x="1170" y="345" class="body">database dan dipaparkan</text>
  <text x="1170" y="380" class="body">mengikut permission, module</text>
  <text x="1170" y="415" class="body">dan workflow.</text>

  <rect x="80" y="520" width="1440" height="170" rx="28" class="card"/>
  <text x="120" y="570" class="section-title">Modular Architecture JTMK Go!</text>
  <text x="120" y="610" class="body">Setiap fungsi dibina sebagai module, bukan satu fail panjang yang bercampur logic dan UI.</text>

  <g transform="translate(120,635)">
    <rect width="180" height="42" rx="21" fill="#dbeafe" stroke="#93c5fd"/>
    <text x="28" y="28" class="pill-text">Ganti Go</text>
  </g>
  <g transform="translate(325,635)">
    <rect width="190" height="42" rx="21" fill="#f1eaff" stroke="#c4b5fd"/>
    <text x="25" y="28" class="pill-text">SubjekGo</text>
  </g>
  <g transform="translate(540,635)">
    <rect width="190" height="42" rx="21" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="25" y="28" class="pill-text">ProgramGo</text>
  </g>
  <g transform="translate(755,635)">
    <rect width="165" height="42" rx="21" fill="#ecfdf5" stroke="#86efac"/>
    <text x="31" y="28" class="pill-text">LinkGo</text>
  </g>
  <g transform="translate(945,635)">
    <rect width="265" height="42" rx="21" fill="#eef2ff" stroke="#a5b4fc"/>
    <text x="30" y="28" class="pill-text">Photo Repository</text>
  </g>
  <g transform="translate(1235,635)">
    <rect width="170" height="42" rx="21" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="35" y="28" class="pill-text">Survey</text>
  </g>

  <rect x="80" y="710" width="690" height="135" rx="24" class="mini"/>
  <text x="115" y="755" class="section-title">Native PHP biasa</text>
  <text x="115" y="795" class="body">Banyak perkara perlu ditulis manual:</text>
  <text x="115" y="825" class="body">routing, session, query dan validation.</text>

  <rect x="830" y="710" width="690" height="135" rx="24" class="mini"/>
  <text x="865" y="755" class="section-title">Laravel</text>
  <text x="865" y="795" class="body">Ada standard structure:</text>
  <text x="865" y="825" class="body">lebih scalable, reusable dan maintainable.</text>

  <text x="80" y="875" class="small">Jawapan ringkas: "Saya develop sistem ini menggunakan Laravel, Blade, Tailwind CSS dan MySQL dengan modular architecture."</text>
</svg>
